server.port=8080

# MySQL ONLY — hardcoded so stale IDE/env DB_URL=jdbc:postgresql... cannot override.
spring.datasource.url=jdbc:mysql://localhost:3306/warmup_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.initialization-fail-timeout=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.fetch_size=30
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

app.cors.origins=http://localhost:5173
