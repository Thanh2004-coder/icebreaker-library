# Ping Render free tier so the Spring Boot service does not sleep after ~15 min idle.
# Measured cold start: /api/health can take 20–135s; warm is typically under 1s.
name: Keep Render awake

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend health endpoint
        env:
          BACKEND_URL: https://icebreaker-library-2.onrender.com
        run: |
          set -e
          echo "Pinging $BACKEND_URL/api/health"
          curl -fsS --max-time 180 -o /tmp/health.json -w "http=%{http_code} time=%{time_total}s\n" \
            "$BACKEND_URL/api/health"
          cat /tmp/health.json
          echo
          # Touch /api/games so Hikari keeps a warm Neon connection (not just JVM).
          echo "Pinging $BACKEND_URL/api/games"
          curl -fsS --max-time 180 -o /tmp/games.json -w "http=%{http_code} time=%{time_total}s\n" \
            "$BACKEND_URL/api/games?page=0&size=1"
          echo "games bytes=$(wc -c </tmp/games.json)"
